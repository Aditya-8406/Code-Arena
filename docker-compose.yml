version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: codearena-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=codearena

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: codearena-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/codearena
      - JWT_SECRET=codearena_production_docker_jwt_key_2026
      - CLIENT_URL=http://localhost:5173
      - NODE_ENV=production
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: codearena-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongodb_data:
